# Example nginx site config for backend.atleast80.com
# Copy/adapt on your server, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name backend.atleast80.com;

    # Allow large logo, menu, and story uploads (0 = no limit)
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for big uploads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
}
